name: Render Service Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier spinning down after 15 minutes of inactivity
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping WanderVibe Server
    runs-stay: false
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping Request
        run: |
          TARGET_URL="${{ secrets.RENDER_APP_URL || 'https://wandervibe.me/ping' }}"
          echo "Pinging $TARGET_URL at $(date -u)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$TARGET_URL")
          echo "Response HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Ping successful! Server is awake."
          else
            echo "Ping completed with status $STATUS (server waking up or DNS resolving)"
          fi
